about:
  title: "About Me"
  description: |
    I am a Bioengineer (UCSC '10) turned Data Scientist and Founder. My background is an integrated study of general chemistry, jazz history, and bioethics, which I now apply to solving complex technical and social problems.
    
    Currently based in Trujillo Alto, Puerto Rico, I founded MYCALLA INC. to empower local communities through innovative communication solutions. My technical expertise spans Python, NAV Systems, and Compliance (GxP, ALCOA+), allowing me to move seamlessly between the lab, the warehouse, and the boardroom.
