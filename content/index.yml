faq:
  title: Credentials & Expertise
  description: Details on my certifications and technical capabilities.
  categories:
    - title: Certifications
      questions:
        - label: What are your key certifications?
          content: |
            I hold certifications in ISO 13485:2016 (Quality Management for Medical Devices), ISO 45001:2018 (Occupational Health and Safety), and Good Documentation Practice (GxP). I am also trained in Computer System Validation (CSV) and ALCOA+ Principles.
        - label: Do you have specialized training?
          content: |
            Yes, I have a Diploma in Pharmacy Technician and specialized training in Biomolecules (DNA Replication & Sequencing) and Mapping Techniques Using Drones.
    - title: Technical Skills
      questions:
        - label: What programming languages do you use?
          content: |
            I am proficient in Python, which I have used for bioinformatics database applications and data analysis. I also have experience with HTML/CSS for documentation sites and web projects like SyncCraft.
        - label: What is your experience with Data & Networks?
          content: |
            I have tutored students in Computer Networks (wireless and wireline architectures) and possess strong data analytics skills honed during my time as a Mentor and Researcher. I am currently exploring AI Agentic Systems and Blockchain technology.
    - title: Community & Ethics
      questions:
        - label: What is your involvement in Bioethics?
          content: |
            My academic background includes an interdisciplinary focus on Bioethics, leading discussions on genetics, medicine, and biotechnology literacy. I believe technology must be guided by strong ethical frameworks.
        - label: How are you involved in the community?
          content: |
            I am a Poll Worker for Santa Clara County (past) and deeply involved in Civil Rights and Social Action. At MYCALLA INC., our core mission is to bridge the digital divide and foster prosperity in Puerto Rico.