title: About Me
description: Discover the journey of Steven Hobbs—from Bioengineering research to founding MYCALLA INC. in Puerto Rico—and his vision for AI, biotechnology, and community connectivity.
content: |
  Hi, I'm **Steven Hobbs**, a Bioengineer, Data Scientist, and the Founder of **MYCALLA INC.** based in Trujillo Alto, Puerto Rico. My career is defined by a convergence of disciplines: bridging the precision of biological data with the limitless potential of AI and community infrastructure.

  My path started at the **University of California, Santa Cruz**, where I earned a Bachelor of Science in Bioengineering. Early on, I discovered a passion for computational biology, applying neural networks to protein structure prediction and developing database applications for developmental biology. Since then, I’ve expanded my expertise into inventory logistics, compliance (GxP, ISO 13485), and now, advanced communication solutions.

  ### My Philosophy: Precision Meets Innovation

  My approach is rooted in the **scientific method** and **ethical responsibility**. Whether I am validating computer systems for medical compliance or designing agentic workflows for my AI project, **SyncCraft**, I believe that rigorous standards and creative problem-solving must go hand-in-hand.

  At **MYCALLA INC.**, my mission is to empower the people of Puerto Rico. We are committed to bridging gaps and enhancing quality of life through reliable, cutting-edge communication technologies. I believe that technology finds its highest purpose when it serves the community that builds it.

  ### What Drives Me

  I am driven by the challenge of **optimization and connection**. From streamlining warehouse processes to untangling complex genetic algorithms, I love turning raw data into actionable, life-improving insights. Currently, I am deeply focused on the intersection of **AI agents** and **biotech infrastructure**, exploring how intelligent systems can revolutionize local industries.

  ### Beyond the Lab

  When I'm not coding or running business operations, I am a dedicated student of the **history and roots of Jazz**, exploring how improvisation in music mirrors innovation in engineering. I am also deeply involved in **Bioethics** and civic engagement, serving as a Poll Worker and advocate for Civil Rights.

  Thanks for stopping by. Feel free to browse my [repositories](https://github.com/shobbs) or [get in touch](mailto:mail.shobbs+ai@gmail.com) if you'd like to collaborate on the future of tech in Puerto Rico!
